name: Linter Runner

on:
  pull_request:

  push:
    branches:
      - master

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint
